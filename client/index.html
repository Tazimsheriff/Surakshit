<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SURAKSHIT helps people review suspicious messages and links before they click." />
    <title>SURAKSHIT</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;900&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var theme = localStorage.getItem("surakshit.theme");
        if (theme === "dark") document.documentElement.classList.add("dark");
        var language = localStorage.getItem("surakshit.lang");
        if (language === "ta") document.documentElement.lang = "ta";
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
